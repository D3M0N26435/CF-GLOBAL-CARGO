<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF GLOBAL CARGO — Panel Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="admin-body">

    <!-- LOGIN SECTION -->
    <div id="loginSection" style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
        <div class="modal-card" style="max-width: 400px;">
            <h2>Admin Login</h2>
            <form id="loginForm" style="margin-top: 20px;">
                <div class="form-group" style="margin-bottom:15px;"><label>Correo</label><input type="email" id="loginEmail" required></div>
                <div class="form-group" style="margin-bottom:15px;"><label>Contraseña</label><input type="password" id="loginPassword" required></div>
                <button type="submit" class="btn-submit-quote">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="adminDashboard" style="display:none;">
        <header class="admin-header">
            <h3>Panel de Control CF Global Cargo</h3>
            <button id="btnLogout" class="btn-admin-login">Cerrar Sesión</button>
        </header>
        <div class="admin-content">
            <button class="btn-cotizar-header" id="btnOpenNew" style="margin-bottom: 20px;">+ Agregar Producto</button>
            <table class="admin-table">
                <thead>
                    <tr><th>Imagen</th><th>Nombre</th><th>Origen</th><th>P. Unitario</th><th>Puesto Bolivia 🇧🇴</th><th>Acciones</th></tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
