<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración — CF Global Cargo</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background: var(--bg-light);">

    <!-- ==================== LOGIN SECTION ==================== -->
    <section id="loginSection" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div style="background: var(--white); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid var(--border-color);">
            <div class="text-center" style="margin-bottom: 25px;">
                <h2 style="color: var(--primary-blue); font-size: 1.5rem;">ACCESO ADMINISTRADOR</h2>
                <p style="color: var(--text-light); font-size: 0.85rem;">CF Global Cargo — Gestión de Catálogo</p>
            </div>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 0.85rem; font-weight: 750;">Correo Electrónico</label>
                    <input type="email" id="loginEmail" required placeholder="admin@cfglobalcargo.com" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="font-size: 0.85rem; font-weight: 750;">Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                </div>
                <button type="submit" class="btn-cotizar-header" style="width: 100%; justify-content: center; border:none; cursor:pointer;">INGRESAR AL PANEL</button>
            </form>
        </div>
    </section>

    <!-- ==================== ADMIN DASHBOARD ==================== -->
    <div id="adminDashboard" style="display: none;">
        <!-- Header Admin -->
        <header style="background: var(--primary-blue); color: var(--white); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.2rem;">Panel de Control ⚙️ — CF Global Cargo</h2>
            <div style="display: flex; gap: 15px; align-items: center;">
                <a href="index.html" style="background: rgba(255,255,255,0.15); color: var(--white); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 700;">
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 3 2.5 11h2.7v9h5.1v-5.7h3.4V20h5.1v-9h2.7z"/></svg> Volver al Inicio
                </a>
                <button id="btnLogout" style="background: var(--accent-orange); color: var(--white); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.85rem;">
                    Cerrar Sesión
                </button>
            </div>
        </header>

        <main class="container" style="padding: 40px 20px;">
            <!-- Formulario para Agregar Producto -->
            <div style="background: var(--white); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 40px;">
                <h3 style="color: var(--primary-blue); margin-bottom: 20px;">📦 Registrar Nuevo Producto en Catálogo</h3>
                <form id="addProductForm" class="form-grid">
                    <div class="form-group col-6">
                        <label>Categoría / Origen *</label>
                        <select id="prod-categoria" required style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                            <option value="china">🇨🇳 Productos desde China</option>
                            <option value="zofri">🇨🇱 Productos desde ZOFRI - Iquique</option>
                        </select>
                    </div>
                    <div class="form-group col-6">
                        <label>Nombre del Producto *</label>
                        <input type="text" id="prod-nombre" required placeholder="Ej. Bicicleta Eléctrica Plegable" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                    </div>
                    <div class="form-group col-12">
                        <label>Descripción Corta *</label>
                        <textarea id="prod-desc" required rows="2" placeholder="Detalles clave del producto..." style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;"></textarea>
                    </div>
                    <div class="form-group col-4">
                        <label>Precio Unitario (USD) *</label>
                        <input type="number" step="0.01" id="prod-precioUnitario" required placeholder="350" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                    </div>
                    <div class="form-group col-4">
                        <label>Precio por Caja (USD) *</label>
                        <input type="number" step="0.01" id="prod-precioCaja" required placeholder="3200" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                    </div>
                    <div class="form-group col-4">
                        <label>Unidades por Caja *</label>
                        <input type="number" id="prod-unidadesCaja" required placeholder="10" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                    </div>
                    <div class="form-group col-6">
                        <label>Precio Puesto en Bolivia (Ej. $420 USD) *</label>
                        <input type="text" id="prod-precioBolivia" required placeholder="$420 USD puesto en La Paz/Oruro" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                    </div>
                    <div class="form-group col-6">
                        <label>Fotografía del Producto (Desde tu Dispositivo) *</label>
                        <input type="file" id="prod-imagenFile" accept="image/*" required style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:6px; background:var(--white);">
                    </div>
                    <div class="form-group col-6">
                        <label>Disponibilidad *</label>
                        <select id="prod-disponibilidad" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px;">
                            <option value="disponible">Disponible</option>
                            <option value="proxima_llegada">Próxima Llegada</option>
                            <option value="agotado">Agotado</option>
                        </select>
                    </div>
                    <div class="form-group col-12" style="margin-top: 10px;">
                        <button type="submit" class="btn-cotizar-header" style="border:none; cursor:pointer;">GUARDAR Y PUBLICAR PRODUCTO</button>
                    </div>
                </form>
            </div>

            <!-- Listado de Productos -->
            <div style="background: var(--white); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color);">
                <h3 style="color: var(--primary-blue); margin-bottom: 20px;">📋 Productos Registrados en Base de Datos</h3>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-light); font-size: 0.85rem;">
                                <th style="padding: 10px;">Imagen</th>
                                <th style="padding: 10px;">Nombre</th>
                                <th style="padding: 10px;">Categoría</th>
                                <th style="padding: 10px;">Precio Unit.</th>
                                <th style="padding: 10px;">Precio Bolivia</th>
                                <th style="padding: 10px;">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- Se llena dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
